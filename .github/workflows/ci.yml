name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev libspeexdsp-dev

      - name: Download Go modules
        run: go mod download

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build frontend
        run: |
          cd frontend && yarn install --frozen-lockfile && yarn build
        # Embed not required for Go unit tests; this step only verifies the UI compiles.

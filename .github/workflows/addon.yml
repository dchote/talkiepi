# Build and push Home Assistant add-on Docker images to GHCR.
# Addon Dockerfile expects build context at repo root.
name: Addon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  addon-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version without 'v' so Supervisor can pull (must match addon/config.yaml version)
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' addon/config.yaml | sed 's/version: *"\?\([^"]*\)"\?/\1/' | tr -d ' ')
            echo "tag=${VERSION:-latest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./addon/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/amd64-addon-talkiepi:${{ steps.tag.outputs.tag }}
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base/amd64:9.2.0
          platforms: linux/amd64

      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./addon/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/aarch64-addon-talkiepi:${{ steps.tag.outputs.tag }}
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base/aarch64:9.2.0
          platforms: linux/arm64
